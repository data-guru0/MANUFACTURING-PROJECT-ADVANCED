# W16: one share, one shared login, read/write for everyone who knows it.
# No recycle bin, no shadow copies (versions), no audit log, no backups.
[global]
   server role = standalone server
   workgroup = APEX
   netbios name = FILESERVER
   security = user
   map to guest = never
   server min protocol = SMB2_10
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   log level = 1

[Quotes]
   comment = Quotes, calculators, price lists (everyone)
   path = /srv/share/Quotes
   read only = no
   browseable = yes
   valid users = fileshare agent-ro
   # S2 (FDE request to Vikram): the agent's own account can read, never write or delete.
   read list = agent-ro
   create mask = 0666
   directory mask = 0777
