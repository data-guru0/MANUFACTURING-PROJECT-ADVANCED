<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Apex review{% endblock %}</title>
<!-- show refusals (403 from OPA, 400, 409) in the page too; htmx 2 swaps only 2xx by default -->
<meta name="htmx-config" content='{"responseHandling": [{"code": "204", "swap": false}, {"code": "[2-4]..", "swap": true}, {"code": "...", "swap": false, "error": true}]}'>
<script src="/static/htmx.min.js"></script>
<style>
  :root { --ink:#1d2430; --muted:#5c6675; --line:#d9dee5; --bg:#f6f7f9; --card:#fff; --accent:#1f5fbf; --warn:#a15c00; --bad:#b42318; --ok:#16794c; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:16px; padding:10px 20px; background:var(--ink); color:#fff; }
  header a { color:#fff; text-decoration:none; font-weight:600; }
  header .me { margin-left:auto; font-size:13px; opacity:.9; }
  header .me a { font-weight:400; text-decoration:underline; margin-left:10px; }
  main { padding:16px 20px; max-width:1500px; margin:0 auto; }
  h1 { font-size:20px; margin:4px 0 12px; } h2 { font-size:16px; margin:18px 0 8px; } h3 { font-size:14px; margin:12px 0 6px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:12px; }
  table { border-collapse:collapse; width:100%; } th, td { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-weight:600; color:var(--muted); font-size:12px; } td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  .badge { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; border:1px solid var(--line); background:#eef1f5; }
  .badge.senior { background:#fff3e0; border-color:#f0c48a; color:var(--warn); }
  .badge.escalate, .badge.bad { background:#fdecea; border-color:#f3b4ad; color:var(--bad); }
  .badge.ok { background:#e8f5ee; border-color:#a9d8bf; color:var(--ok); }
  .grid { display:grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap:14px; }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }
  .drawing iframe, .drawing img { width:100%; height:560px; border:1px solid var(--line); background:#fff; object-fit:contain; }
  .flag { color:var(--warn); } .needs { background:#fff8e6; }
  input[type=text], textarea { width:100%; font:inherit; padding:4px 6px; border:1px solid var(--line); border-radius:4px; }
  textarea { min-height:150px; }
  button { font:inherit; padding:6px 12px; border-radius:4px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  button.secondary { background:#fff; color:var(--accent); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .msg { padding:8px 10px; border-radius:4px; margin-top:8px; }
  .msg.bad { background:#fdecea; color:var(--bad); } .msg.ok { background:#e8f5ee; color:var(--ok); }
  pre.mail { white-space:pre-wrap; font:13px/1.4 ui-monospace, Consolas, monospace; background:#fafbfc; padding:8px; border:1px solid var(--line); max-height:260px; overflow:auto; }
  details > summary { cursor:pointer; color:var(--accent); }
</style>
</head>
<body>
<header>
  <a href="/">Apex review</a> <a href="/capacity">Capacity</a> <a href="/digest">Digest</a>
  <span class="me">{{ me.name }} ({{ me.username }}) · {{ me.roles | join(", ") }}<a href="/signout">Sign out</a></span>
</header>
<main>{% block main %}{% endblock %}</main>
</body>
</html>
