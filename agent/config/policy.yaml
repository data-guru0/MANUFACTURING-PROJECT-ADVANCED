# Policy DATA, read by OPA (ADR 0004). Rules live in agent/policy/rego/.
# ai_enabled: the kill switch. false = OPA denies every AI step and the system drops to manual mode.
ai_enabled: true

# Which graph node (or job) may call which MCP tool (tools.rego). Anything not listed is denied.
# Write tools are listed ONLY for `act`, which runs after a human approval (S8).
tools:
  retrieve: [erp.search_products, erp.get_product, erp.find_customer, share.list_quotes, share.read_quote]
  cost_leadtime_co2_terms: [erp.get_product, erp.list_workcenters, erp.get_supplier_prices, erp.material_info,
                            erp.get_customer, erp.open_workload]
  act: [erp.create_draft_quotation, erp.mark_quote_sent, mail.send_reply]   # S8: each also needs a signed approval (actions.rego)
  learn: [erp.quote_status]   # S8: outcomes of the quotations the agent created
  knowledge_sync: [share.list_quotes, share.read_quote, share.ramesh_notes, share.material_prices]
  security_gate: [erp.customer_by_email, erp.find_customer]
  extract: [erp.get_product, erp.search_products]   # S4: repeat parts named in an email without a drawing
  repeat: [erp.get_drawing]
  reply_router: [erp.get_quotation, erp.record_lost]   # S15: a reply's quotation; a decline's lost reason into Odoo
  expiry: [erp.mark_expired]                          # S15: tag open quotations past their validity
  suppliers: [erp.get_product, erp.list_vendors, erp.record_supplier_quote, erp.create_draft_po, mail.send_supplier_rfq]   # S17
  whatif: [erp.list_workcenters, erp.material_info, erp.get_supplier_prices, erp.get_customer, erp.open_workload]  # S16: read-only                          # S12: the archived drawing of a revision, to diff it

# The security gate (S3, gate.rego). A flagged email is still processed, but gets a red banner and needs a human.
gate:
  injection_threshold: 0.5   # Prompt Guard 2 probability; measured in docs/fde/TRIAGE_EVAL.md
  files:
    max_file_mb: 15          # S9: a bigger attachment is quarantined unread (Apex's real drawings are < 5 MB)
    # The REAL type (libmagic) -> the file-name extensions allowed for it. Anything else is quarantined.
    allowed_types:
      application/pdf: [pdf]
      application/zip: [zip]
      text/plain: [dxf, step, stp, txt, csv]
      application/dxf: [dxf]
      image/vnd.dxf: [dxf]
      model/step: [step, stp]
      image/png: [png]
      image/jpeg: [jpg, jpeg]
      image/tiff: [tif, tiff]
    zip:
      max_depth: 1           # a ZIP inside a ZIP is refused
      max_files: 50
      max_total_mb: 100
      max_ratio: 100         # unpacked / packed size; more looks like a zip bomb

# The quote graph's guards and routing (S6, risk.rego). Nothing is ever sent without a human: every route ends in review.
graph:
  job_budget_usd: 0.25        # LLM spend per job (LiteLLM's response cost); above it the job goes to a human
  step_timeout_s: 900         # per node
  max_attempts: 2             # per node, for transient errors
  recursion_limit: 60
  senior_above_usd: 5000.0    # quotes worth more than this need a senior estimator (S7 enforces it at approval)

# Governance (S9). The ROI numbers are ASSUMPTIONS, named in docs/fde/GOVERNANCE_REPORT.md; Meera owns them.
governance:
  roi:
    baseline_minutes_per_quote: 150   # 2.5 h by hand
    baseline_source: "SOLUTION_DESIGN.md W1, from the L6 SOP walkthrough and Ramesh's estimate"
    review_minutes_per_quote: 30      # the W1 target; not yet measured as effort (the screen measures waiting time)
    review_source: "the W1 target in SOLUTION_DESIGN.md, an assumption until S10 measures it"
    estimator_rate_usd_per_h: 25.0
    rate_source: "an assumption for the lab (loaded cost of an estimator in India, where the grid factor puts Apex); replace with Apex's figure"

# Data governance (S9). retention.py deletes what is no longer needed; data_governance decides what may leave the box.
retention:
  checkpoint_days: 30         # the graph's working memory of a finished job (inputs, drafts, the approval token)
  quarantine_days: 30         # files the security gate stopped
data_governance:
  # true = an RFQ whose email or file names mention export control (ITAR, EAR, export-controlled, dual-use) is never sent
  # to an external LLM: it goes straight to a person (status `manual`). false = it is processed and routed to a senior.
  keep_export_controlled_local: false

# What Apex can offer (S11, capability check). A required certificate not in this list becomes a CONDITION of the bid.
capability:
  certificates_held: ["ISO 9001", "3.1", "EN 10204", "FAI", "PPAP", "first article", "RoHS", "material certificate"]

# S13: design-for-manufacturing rules (W12), costing/dfm.py. A suggestion is an OPTIONAL alternate line priced by the
# engine with one feature changed; the customer's spec is never changed. Values: Ramesh's shop standards.
dfm:
  min_saving_pct: 3                 # offer an alternative only when the engine saves at least this much per part
  tolerance_needed_mm:              # the tightest tolerance a family usually needs
    sheet_panel: 0.1
    mounting_plate: 0.1
    l_bracket: 0.1
    u_bracket: 0.1
    spacer: 0.05
    flanged_housing: 0.02
    spur_gear: 0.02
    keyed_shaft: 0.02
  ra_needed_um:                     # the finest surface finish a family usually needs (machined parts only)
    mounting_plate: 3.2
    l_bracket: 3.2
    u_bracket: 3.2
    spacer: 3.2
    flanged_housing: 1.6
    spur_gear: 1.6
    keyed_shaft: 1.6
  material_alternatives:
    MAT-SS316: {to: MAT-SS304, note: "304 stainless is cheaper and machines faster; 316 is needed only for chlorides or marine use"}
    MAT-AL7075: {to: MAT-AL6061, note: "6061 is cheaper and anodizes better; 7075 is needed only for high strength"}
  standard_threads: [M3x0.5, M4x0.7, M5x0.8, M6x1.0, M8x1.25, M10x1.5, M12x1.75]
  deep_hole_depth_to_dia: 6         # defined, not checkable yet: the extraction has no hole depth
  min_internal_radius_mm: 1.0       # defined, not checkable yet: no internal radii in the extraction
  min_wall_mm: 2.0                  # defined, not checkable yet: no wall thickness ("thin walls under 2 mm chatter", Ramesh)
  not_checkable: ["deep holes (no hole depth in the drawing data)", "small internal radii (no radii in the drawing data)",
                  "thin walls (no wall thickness in the drawing data)"]

# S17: supplier RFQs. A price older than this is stale (W13); a supplier gets this long to answer; at most this many
# vendors per product.
suppliers:
  stale_after_days: 180
  reply_timeout_hours: 48
  vendors_per_request: 3

# S16: the what-if assistant. Per browser session (one job page) and per question.
whatif:
  session_budget_usd: 0.05
  max_steps: 5                # model calls per question (each may call several tools)

# S15: follow-ups. N days after a quote is sent with no reply, a plain reminder (template) goes to a person to approve.
followups:
  after_days: 7
  max: 1

# Human oversight (S9): how often a synthetic known-bad draft (a canary) is put in front of the reviewers.
oversight:
  canary_rate: 0.05           # per job that reaches review; caught/missed per reviewer: governance/canary.py report

# Why a quote needs more than a routine approval (S9, escalation.rego), and how much more. Levels:
# escalate = a person first, before the draft is trusted | senior = only a senior estimator may approve | check = shown, verify
escalation:
  margin_floor_pct: 12.0      # below this the quote needs Ramesh (price rules and quantity steps can push the margin down)
  margin_ceiling_pct: 45.0    # S14: above this too (the margin curve is advisory; OPA holds the band)
  expected_load_weight: 1.0   # S14: how much of the open quotes' expected load (minutes x P(win)) new delivery dates
                              # book on top of the confirmed work orders (0 = ignore open quotes, the legacy behaviour)
  levels:
    margin_below_floor: senior
    margin_above_ceiling: senior
    new_customer: senior      # nobody at Apex has quoted them yet: a senior sets the relationship
    low_confidence: check     # a value the agent read with low confidence (a scan's size, a missing tolerance...)
    infeasible_date: check    # the requested date can't be met; the committed date is in the quote

# Commercial policy for quotes (S5): Meera's decisions, read by the costing engine as OPA data.
# Margins were Ramesh's tier table; the validity, price protection and lead-time buffers are new (W7, W8).
pricing_policy:
  overhead_pct: 15.0               # on everything except outside processes
  margin_pct_by_tier: {A: 15.0, B: 22.0, C: 30.0}
  margin_step_down: [[100, 3.0], [1000, 6.0]]   # minus N points from this quantity on
  min_margin_pct: 8.0
  default_tier: B                  # a customer Odoo has no tier for (e.g. a new prospect)
  # Price per unit of stock vs what the closest analogs were won at. Measured spread (S5): middle half -50 % .. +105 %,
  # because analogs differ in quantity, features and finish, so only gross outliers are flagged; the gap is always shown.
  analog_gap_flag_ratio: 3.0       # flag when the price is > 3x or < 1/3 of the analogs'
  validity_days: {default: 30, volatile: 14}   # volatile = material whose index moved > 10 % in 6 months
  volatile_move_pct: 10.0
  price_protection_pct: 5.0        # index move before acceptance that adjusts the material portion
  lead_buffer_days: 2              # added to the committed date
  rush_overtime_capacity: 1.5      # x normal daily capacity (overtime) for the rush option
  rush_premium_pct: 15.0
  certificate_usd_per_lot:         # documents the customer asks for (S4 RfqRequirements)
    material_cert_3_1: 25.0
    fai_report: 150.0
    ppap: 400.0
  index_for_material:              # World Bank Pink Sheet series that drives each material's price
    MAT-AL6061: Aluminum
    MAT-AL7075: Aluminum
    MAT-SS304: Nickel
    MAT-SS316: Nickel
    MAT-C360: Copper
    MAT-1018: Iron ore, cfr spot
    MAT-S235: Iron ore, cfr spot
    MAT-TI64: null                 # no public monthly index: the short validity applies
    MAT-POM: null

# --- pricing_rules: managed by `python -m apex_agent.knowledge.rules approve` (human-approved only) ---
pricing_rules: []
