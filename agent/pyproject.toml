[project]
name = "apex-agent"
version = "0.1.0"
description = "Apex quoting agent (the FDE solution). Runs in Docker beside the legacy system."
requires-python = "==3.12.*"
dependencies = [
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "pyyaml==6.0.3",
    "mcp==2.3.0",
    "psycopg[binary]==3.3.9",
    "fastembed==0.9.1",
    "openpyxl==3.1.5",
    "smbprotocol==1.17.0",
    # S3: ingestion and the security gate
    "minio==7.2.20",
    "python-magic==0.4.27",   # libmagic (apt libmagic1 in the image): the real file type
    "dkimpy==1.1.8",
    "pymupdf==2.1",
    "presidio-analyzer==2.2.366",
    "presidio-anonymizer==2.2.366",
    # Presidio's NLP engine: the small English spaCy model (12 MB), a wheel from spaCy's GitHub releases
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # S4: document understanding
    "ezdxf==1.4.5",
    "cadquery-ocp==7.9.3.1.1",   # CadQuery's OpenCascade kernel, used directly (full CadQuery adds SciPy, numba, trame)
    "ocrmypdf==17.14.2",          # + apt tesseract-ocr, ghostscript in the image
    "lingua-language-detector==2.2.0",
    "langgraph==1.2.24",
    "langgraph-checkpoint-postgres==3.2.1",   # S6: durable execution (PostgresSaver)
    # S5: costing (cycle-time quantile model)
    "scikit-learn==1.8.0",
    # S7: the review screen (FastAPI + HTMX; the JWT is verified again in the app)
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.34",
    "pyjwt[crypto]==2.15.1",
    # S8: the quote PDF
    "weasyprint==70.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
