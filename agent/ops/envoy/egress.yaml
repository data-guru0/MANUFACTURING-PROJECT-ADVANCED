# Envoy EGRESS (S1): the only way out of the agent stack (ADR 0006). An HTTP CONNECT proxy with an
# allow-list. Only LiteLLM (Groq) and ClamAV (signature updates) can reach it; every other host gets 403.
# S5 adds the commodity-index data host. Adding a host here is an explicit, reviewed change.
admin:
  address: {socket_address: {address: 0.0.0.0, port_value: 9901}}
static_resources:
  listeners:
  - name: egress
    address: {socket_address: {address: 0.0.0.0, port_value: 10000}}
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: egress
          access_log: [{name: envoy.access_loggers.stdout, typed_config: {"@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog}}]
          http_filters: [{name: envoy.filters.http.router, typed_config: {"@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router}}]
          route_config:
            virtual_hosts:
            - name: groq
              domains: ["api.groq.com:443"]
              routes:
              - match: {connect_matcher: {}}
                route: {cluster: groq, upgrade_configs: [{upgrade_type: CONNECT, connect_config: {}}]}
            - name: clamav
              domains: ["database.clamav.net:443"]
              routes:
              - match: {connect_matcher: {}}
                route: {cluster: clamav, upgrade_configs: [{upgrade_type: CONNECT, connect_config: {}}]}
            - name: worldbank   # S5: the World Bank Pink Sheet (monthly commodity prices) for price protection
              domains: ["thedocs.worldbank.org:443"]
              routes:
              - match: {connect_matcher: {}}
                route: {cluster: worldbank, upgrade_configs: [{upgrade_type: CONNECT, connect_config: {}}]}
            - name: deny_everything_else
              domains: ["*"]
              routes:
              - match: {connect_matcher: {}}
                direct_response: {status: 403, body: {inline_string: "egress denied by the Apex allow-list
"}}
              - match: {prefix: "/"}
                direct_response: {status: 403, body: {inline_string: "egress denied by the Apex allow-list
"}}
  clusters:
  - name: groq
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    connect_timeout: 10s
    load_assignment: {cluster_name: groq, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: api.groq.com, port_value: 443}}}}]}]}
  - name: clamav
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    connect_timeout: 10s
    load_assignment: {cluster_name: clamav, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: database.clamav.net, port_value: 443}}}}]}]}
  - name: worldbank
    type: LOGICAL_DNS
    dns_lookup_family: V4_ONLY
    connect_timeout: 10s
    load_assignment: {cluster_name: worldbank, endpoints: [{lb_endpoints: [{endpoint: {address: {socket_address: {address: thedocs.worldbank.org, port_value: 443}}}}]}]}
